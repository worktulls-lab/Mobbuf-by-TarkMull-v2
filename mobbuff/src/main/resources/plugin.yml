name: MobBuff
version: '1.0.0'
main: com.example.mobbuff.MobBuffPlugin
api-version: '1.21'
description: Удваивает здоровье и урон мобов, включается/выключается командой.
author: YourName

commands:
  mobbuff:
    description: Управляет хардкор-режимом мобов и мем-командами.
    usage: /mobbuff <on|off|status|help|maxwell|superzombie|spawnhorde|chickenrain|weather fog|bossprogress|resetkills|reload>
    permission: mobbuff.toggle
    permission-message: У тебя нет прав на использование этой команды.

permissions:
  mobbuff.toggle:
    description: Разрешает включать/выключать баф мобов.
    default: op
